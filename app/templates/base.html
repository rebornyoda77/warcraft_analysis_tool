<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WoW Toolkit{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('home') }}">WoW Toolkit</a>
    <a href="{{ url_for('characters.index') }}">Characters</a>
    <a href="{{ url_for('logs.index') }}">Combat Logs</a>
    <a href="{{ url_for('simulator.index') }}">Simulator</a>
    <a href="{{ url_for('stats.index') }}">Stat Weights</a>
  </nav>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flashes">
          {% for category, message in messages %}
            <li class="flash flash-{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
